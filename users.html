<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios — POS Tienda Escolar</title>
    <script>if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark');</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-100 dark:bg-[#1a1a1a] h-screen flex transition-colors">

    <div id="user-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white dark:bg-[#222] rounded-2xl p-6 w-80 shadow-2xl" style="border:1px solid #2a2a2a;">
            <h3 class="text-lg font-bold mb-4 dark:text-gray-100">Agregar usuario</h3>
            <div class="flex flex-col gap-3">
                <input id="input-username" type="text" placeholder="Usuario"
                    class="border dark:border-[#333] dark:bg-[#2a2a2a] dark:text-gray-100 dark:placeholder-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input id="input-password" type="password" placeholder="Contraseña"
                    class="border dark:border-[#333] dark:bg-[#2a2a2a] dark:text-gray-100 dark:placeholder-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <select id="input-role"
                    class="border dark:border-[#333] dark:bg-[#2a2a2a] dark:text-gray-100 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="EMPLOYEE">Empleado</option>
                    <option value="ADMIN">Administrador</option>
                </select>
            </div>
            <div class="flex gap-2 mt-4">
                <button onclick="saveUser()" class="flex-1 py-2 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700">Guardar</button>
                <button onclick="closeUserModal()" class="flex-1 py-2 bg-gray-100 dark:bg-[#2a2a2a] text-gray-600 dark:text-gray-400 rounded-lg hover:bg-gray-200">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="sidebar"></div>

    <div class="flex-1 flex flex-col p-6 ml-16 overflow-hidden">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-xl font-bold dark:text-gray-100">Usuarios del sistema</h1>
            <button onclick="openUserModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700">+ Agregar usuario</button>
        </div>
        <div class="flex-1 overflow-y-auto">
            <table class="w-full bg-white dark:bg-[#222] rounded-lg shadow text-sm" style="border:1px solid #2a2a2a;">
                <thead class="bg-gray-50 dark:bg-[#2a2a2a] sticky top-0">
                    <tr>
                        <th class="text-left px-4 py-3 font-semibold text-gray-600 dark:text-gray-400">Usuario</th>
                        <th class="text-left px-4 py-3 font-semibold text-gray-600 dark:text-gray-400">Rol</th>
                        <th class="px-4 py-3"></th>
                    </tr>
                </thead>
                <tbody id="users-table">
                    <tr><td colspan="3" class="px-4 py-3 text-gray-400">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/users.js"></script>
</body>
</html>
