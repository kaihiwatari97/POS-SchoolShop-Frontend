<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — POS Tienda Escolar</title>
    <script>if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark');</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-100 dark:bg-[#1a1a1a] h-screen flex items-center justify-center transition-colors">

    <div class="bg-white dark:bg-[#222] rounded-2xl shadow-lg p-8 w-80" style="border:1px solid #2a2a2a;">
        <h1 class="text-2xl font-bold mb-1 dark:text-gray-100">POS Tienda Escolar</h1>
        <p class="text-sm text-gray-400 mb-6">Inicia sesión para continuar</p>
        <div id="error-msg" class="hidden mb-4 p-3 bg-red-50 dark:bg-red-900 text-red-500 dark:text-red-300 text-sm rounded-lg"></div>
        <div class="flex flex-col gap-3">
            <input id="input-username" type="text" placeholder="Usuario"
                class="border dark:border-[#333] dark:bg-[#2a2a2a] dark:text-gray-100 dark:placeholder-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input id="input-password" type="password" placeholder="Contraseña"
                class="border dark:border-[#333] dark:bg-[#2a2a2a] dark:text-gray-100 dark:placeholder-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="login()" class="py-2 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700">Entrar</button>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        if (getToken()) window.location.href = 'index.html';

        async function login() {
    const username = document.getElementById('input-username').value;
    const password = document.getElementById('input-password').value;
    if (!username || !password) { showError('Ingresa usuario y contraseña'); return; }
    try {
        const res = await fetch(`${API}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const text = await res.text();
        const data = text ? JSON.parse(text) : {};
        if (!res.ok) { showError(data.error || 'Usuario o contraseña incorrectos'); return; }
        saveSession(data.token, data.role, data.username);
        window.location.href = 'index.html';
    } catch (e) {
        showError('Error de conexión con la API');
    }
}

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
    </script>
</body>
</html>
