<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario — POS Tienda Escolar</title>
    <script>if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark');</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-100 dark:bg-[#1a1a1a] h-screen flex transition-colors">

    <div id="product-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white dark:bg-[#222] rounded-2xl p-6 w-96 shadow-2xl overflow-hidden" style="border:1px solid #2a2a2a;">
            <h3 id="modal-title" class="text-lg font-bold mb-4 dark:text-gray-100">Agregar producto</h3>
            <div class="flex flex-col gap-3">
                <input id="input-name" type="text" placeholder="Nombre del producto"
                    class="border dark:border-[#333] dark:bg-[#2a2a2a] dark:text-gray-100 dark:placeholder-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input id="input-description" type="text" placeholder="Descripción"
                    class="border dark:border-[#333] dark:bg-[#2a2a2a] dark:text-gray-100 dark:placeholder-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <div class="flex gap-2 min-w-0">
                    <div class="flex items-center min-w-0 flex-1 border dark:border-[#333] rounded-lg overflow-hidden focus-within:ring-2 focus-within:ring-blue-500 dark:bg-[#2a2a2a]">
                        <span class="pl-3 text-gray-400 text-sm select-none">$</span>
                        <input id="input-price" type="number" min="0" step="0.01" placeholder="Precio"
                            class="min-w-0 flex-1 px-2 py-2 text-sm focus:outline-none dark:bg-[#2a2a2a] dark:text-gray-100 dark:placeholder-gray-600">
                    </div>
                    <input id="input-stock" type="number" min="0" placeholder="Stock"
                        class="min-w-0 flex-1 border dark:border-[#333] dark:bg-[#2a2a2a] dark:text-gray-100 dark:placeholder-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <input id="input-barcode" type="text" placeholder="Código de barras (opcional)"
                    class="border dark:border-[#333] dark:bg-[#2a2a2a] dark:text-gray-100 dark:placeholder-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <div>
                    <label class="text-xs text-gray-500 dark:text-gray-400 mb-1 block">Foto del producto</label>
                    <input id="input-image" type="file" accept="image/*" onchange="previewImage(this)"
                        class="w-full text-sm text-gray-500 dark:text-gray-400 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-600 file:font-semibold hover:file:bg-blue-100">
                    <img id="image-preview" class="hidden mt-2 w-full h-32 object-cover rounded-lg">
                </div>
            </div>
            <div class="flex gap-2 mt-4">
                <button onclick="saveProduct()" class="flex-1 py-2 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700">Guardar</button>
                <button onclick="closeProductModal()" class="flex-1 py-2 bg-gray-100 dark:bg-[#2a2a2a] text-gray-600 dark:text-gray-400 rounded-lg hover:bg-gray-200">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="sidebar"></div>

    <div class="flex-1 flex flex-col p-6 ml-20 overflow-hidden">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-xl font-bold dark:text-gray-100">Inventario</h1>
            <button onclick="openProductModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700">+ Agregar producto</button>
        </div>
        <input id="search-input" type="text" placeholder="Buscar producto..."
            class="w-full border border-gray-300 dark:border-[#333] dark:bg-[#222] dark:text-gray-100 dark:placeholder-gray-600 rounded-lg px-4 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <div class="flex-1 overflow-y-auto">
            <table class="w-full bg-white dark:bg-[#222] rounded-lg shadow text-sm" style="border:1px solid #2a2a2a;">
                <thead class="bg-gray-50 dark:bg-[#2a2a2a] sticky top-0">
                    <tr>
                        <th class="px-4 py-3 w-12"></th>
                        <th class="text-left px-4 py-3 font-semibold text-gray-600 dark:text-gray-400">Nombre</th>
                        <th class="text-left px-4 py-3 font-semibold text-gray-600 dark:text-gray-400">Descripción</th>
                        <th class="text-left px-4 py-3 font-semibold text-gray-600 dark:text-gray-400">Precio</th>
                        <th class="text-left px-4 py-3 font-semibold text-gray-600 dark:text-gray-400">Stock</th>
                        <th class="text-left px-4 py-3 font-semibold text-gray-600 dark:text-gray-400">Código</th>
                        <th class="px-4 py-3"></th>
                    </tr>
                </thead>
                <tbody id="products-table">
                    <tr><td colspan="7" class="px-4 py-3 text-gray-400">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/inventory.js"></script>
</body>
</html>
