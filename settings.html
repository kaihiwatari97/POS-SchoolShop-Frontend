<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración — POS Tienda Escolar</title>
    <script>if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark');</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-100 dark:bg-[#1a1a1a] h-screen flex transition-colors">

    <div id="sidebar"></div>

    <div class="flex-1 flex flex-col p-6 ml-16 overflow-hidden">
        <h1 class="text-xl font-bold mb-6 dark:text-gray-100">Configuración</h1>

        <div class="bg-white dark:bg-[#222] rounded-lg shadow p-4 mb-4" style="border:1px solid #2a2a2a;">
            <h2 class="font-bold text-lg mb-4 dark:text-gray-100">Apariencia</h2>
            <div class="flex items-center justify-between">
                <div>
                    <div class="font-semibold text-sm dark:text-gray-100">Modo oscuro</div>
                    <div class="text-xs text-gray-400">Cambia el tema de la aplicación</div>
                </div>
                <button onclick="toggleDarkMode()" id="dark-toggle"
                    class="relative w-12 h-6 rounded-full transition-colors focus:outline-none">
                </button>
            </div>
        </div>

        <div class="bg-white dark:bg-[#222] rounded-lg shadow p-4" style="border:1px solid #2a2a2a;">
            <h2 class="font-bold text-lg mb-3 dark:text-gray-100">Sesión actual</h2>
            <div class="flex justify-between text-sm mb-2">
                <span class="text-gray-500 dark:text-gray-400">Usuario</span>
                <span id="current-user" class="font-semibold dark:text-gray-100"></span>
            </div>
            <div class="flex justify-between text-sm">
                <span class="text-gray-500 dark:text-gray-400">Rol</span>
                <span id="current-role" class="font-semibold dark:text-gray-100"></span>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
