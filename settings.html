<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración — POS Tienda Escolar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex">

    <!-- Modal agregar usuario -->
    <div id="user-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-6 w-80 shadow-2xl">
            <h3 class="text-lg font-bold mb-4">Agregar usuario</h3>
            <div class="flex flex-col gap-3">
                <input id="input-username" type="text" placeholder="Usuario"
                    class="border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input id="input-password" type="password" placeholder="Contraseña"
                    class="border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <select id="input-role"
                    class="border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="EMPLOYEE">Empleado</option>
                    <option value="ADMIN">Administrador</option>
                </select>
            </div>
            <div class="flex gap-2 mt-4">
                <button onclick="saveUser()"
                    class="flex-1 py-2 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700">
                    Guardar
                </button>
                <button onclick="closeUserModal()"
                    class="flex-1 py-2 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200">
                    Cancelar
                </button>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <div id="sidebar"></div>

    <!-- Contenido -->
    <div class="flex-1 flex flex-col p-6 ml-16 overflow-hidden">
        <h1 class="text-xl font-bold mb-6">Configuración</h1>

        <!-- Usuarios del sistema -->
        <div class="bg-white rounded-lg shadow p-4 mb-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold text-lg">Usuarios del sistema</h2>
                <button onclick="openUserModal()"
                    class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700">
                    + Agregar usuario
                </button>
            </div>
            <table class="w-full text-sm">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="text-left px-4 py-3 font-semibold text-gray-600">Usuario</th>
                        <th class="text-left px-4 py-3 font-semibold text-gray-600">Rol</th>
                        <th class="px-4 py-3"></th>
                    </tr>
                </thead>
                <tbody id="users-table">
                    <tr><td colspan="3" class="px-4 py-3 text-gray-400">Cargando...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Info sesión actual -->
        <div class="bg-white rounded-lg shadow p-4">
            <h2 class="font-bold text-lg mb-3">Sesión actual</h2>
            <div class="flex justify-between text-sm mb-2">
                <span class="text-gray-500">Usuario</span>
                <span id="current-user" class="font-semibold"></span>
            </div>
            <div class="flex justify-between text-sm">
                <span class="text-gray-500">Rol</span>
                <span id="current-role" class="font-semibold"></span>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
