<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial — POS Tienda Escolar</title>
    <script>if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark');</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-100 dark:bg-[#1a1a1a] h-screen flex transition-colors">

    <div id="sidebar"></div>

    <div class="flex-1 flex flex-col p-6 ml-20 overflow-hidden">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-xl font-bold dark:text-gray-100">Historial</h1>
        </div>
        <input id="search-input" type="text" placeholder="Buscar en el historial..."
            class="w-full border border-gray-300 dark:border-[#333] dark:bg-[#222] dark:text-gray-100 dark:placeholder-gray-600 rounded-lg px-4 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <div class="flex-1 overflow-y-auto">
            <table class="w-full bg-white dark:bg-[#222] rounded-lg shadow text-sm" style="border:1px solid #2a2a2a;">
                <thead class="bg-gray-50 dark:bg-[#2a2a2a] sticky top-0">
                    <tr>
                        <th class="text-left px-4 py-3 font-semibold text-gray-600 dark:text-gray-400">Fecha</th>
                        <th class="text-left px-4 py-3 font-semibold text-gray-600 dark:text-gray-400">Acción</th>
                        <th class="text-left px-4 py-3 font-semibold text-gray-600 dark:text-gray-400">Monto</th>
                        <th class="text-left px-4 py-3 font-semibold text-gray-600 dark:text-gray-400">Usuario</th>
                    </tr>
                </thead>
                <tbody id="history-table">
                    <tr><td colspan="4" class="px-4 py-3 text-gray-400">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/history.js"></script>
</body>
</html>
