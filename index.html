<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Tienda Escolar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex">

    <!-- Modal de confirmación -->
    <div id="confirm-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-6 w-80 shadow-2xl">
            <h3 class="text-lg font-bold mb-4">Confirmar cobro</h3>
            <div class="mb-4">
                <div class="flex justify-between text-sm mb-2">
                    <span class="text-gray-500">Método</span>
                    <span id="modal-method" class="font-semibold"></span>
                </div>
                <div id="modal-student-row" class="flex justify-between text-sm mb-2 hidden">
                    <span class="text-gray-500">Alumno</span>
                    <span id="modal-student" class="font-semibold"></span>
                </div>
                <div id="modal-received-row" class="flex justify-between text-sm mb-2 hidden">
                    <span class="text-gray-500">Recibido</span>
                    <span id="modal-received" class="font-semibold"></span>
                </div>
                <div id="modal-change-row" class="flex justify-between text-sm mb-2 hidden">
                    <span class="text-gray-500">Cambio</span>
                    <span id="modal-change" class="font-semibold text-green-600"></span>
                </div>
                <div class="border-t pt-2 mt-2 flex justify-between font-bold text-lg">
                    <span>Total</span>
                    <span id="modal-total"></span>
                </div>
            </div>
            <button onclick="processSale(true)"
                class="w-full py-3 bg-green-600 text-white rounded-lg font-bold mb-2 hover:bg-green-700">
                Cobrar e imprimir ticket
            </button>
            <button onclick="processSale(false)"
                class="w-full py-3 bg-green-500 text-white rounded-lg font-bold mb-2 hover:bg-green-600">
                Cobrar sin ticket
            </button>
            <button onclick="closeModal()"
                class="w-full py-2 bg-gray-100 text-gray-600 rounded-lg text-sm hover:bg-gray-200">
                Cancelar
            </button>
        </div>
    </div>

    <!-- Sidebar -->
    <div id="sidebar"></div>

    <!-- Contenido principal -->
    <div class="flex flex-1 overflow-hidden ml-16">

        <!-- Panel izquierdo: productos -->
        <div class="flex-1 flex flex-col p-4 overflow-hidden">
            <h1 class="text-xl font-bold mb-3">Punto de Venta</h1>
            <input id="search-input" type="text" placeholder="Buscar producto o escanear código..."
                class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <div class="flex-1 overflow-y-auto">
                <table class="w-full bg-white rounded-lg shadow text-sm">
                    <thead class="bg-gray-50 sticky top-0">
                        <tr>
                            <th class="text-left px-4 py-3 font-semibold text-gray-600">Producto</th>
                            <th class="text-left px-4 py-3 font-semibold text-gray-600">Precio</th>
                            <th class="text-left px-4 py-3 font-semibold text-gray-600">Stock</th>
                            <th class="px-4 py-3"></th>
                        </tr>
                    </thead>
                    <tbody id="products-table">
                        <tr><td colspan="4" class="px-4 py-3 text-gray-400">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Panel derecho -->
        <div class="w-80 bg-white flex flex-col shadow-lg">

            <!-- Parte superior fija: método de pago + inputs -->
            <div class="p-4 border-b">
                <div class="flex gap-2 mb-3">
                    <button onclick="setPaymentMethod('CASH')" id="btn-cash"
                        class="flex-1 py-2 rounded-lg bg-blue-600 text-white text-sm font-semibold">
                        Efectivo
                    </button>
                    <button onclick="setPaymentMethod('PREPAID_BALANCE')" id="btn-prepaid"
                        class="flex-1 py-2 rounded-lg bg-gray-200 text-gray-700 text-sm font-semibold">
                        Saldo
                    </button>
                </div>
                <div id="cash-section">
                    <input id="cash-input" type="number" placeholder="Monto recibido"
                        class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                        oninput="calcChange()">
                </div>
                <div id="prepaid-section" class="hidden">
                    <div id="balance-warning" class="hidden text-red-500 text-xs font-semibold mb-2 p-2 bg-red-50 rounded-lg"></div>
                    <input id="student-search" type="text" placeholder="Buscar alumno..."
                        class="w-full border rounded-lg px-3 py-2 mb-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                        oninput="searchStudent(this.value)">
                    <div id="student-list" class="border rounded-lg max-h-32 overflow-y-auto text-sm"></div>
                    <div id="recent-students" class="border rounded-lg text-sm mt-2"></div>
                    <div id="selected-student" class="hidden mt-2 p-2 bg-blue-50 rounded-lg text-sm">
                        <span id="selected-student-name" class="font-semibold"></span>
                        <span id="selected-student-balance" class="ml-2"></span>
                    </div>
                </div>
            </div>

            <div class="p-4 border-b">
                <h2 class="font-bold text-lg">Orden actual</h2>
            </div>
            <div id="order-items" class="flex-1 overflow-y-auto p-4">
                <p class="text-gray-400 text-sm">Sin productos</p>
            </div>

            <div class="p-4 border-t">
                <div class="flex justify-between font-bold text-lg mb-2">
                    <span>Total</span>
                    <span id="order-total">$0.00</span>
                </div>
                <div id="change-row" class="flex justify-between text-sm mb-4">
                    <span class="text-gray-500">Cambio</span>
                    <span id="change-display" class="font-semibold">$0.00</span>
                </div>
                <button onclick="openModal()"
                    class="w-full py-4 bg-green-600 text-white rounded-xl font-bold text-lg hover:bg-green-700">
                    Cobrar
                </button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/sales.js"></script>
</body>
</html>
