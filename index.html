<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Tienda Escolar</title>
    <script>if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark');</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-100 dark:bg-[#1a1a1a] h-screen flex transition-colors">

    <!-- MODAL TEMPORAL DE COBRO (quitar y descomentar el de arriba cuando ya haya caja, impresora y scanner) -->
    <div id="confirm-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white dark:bg-[#222] rounded-2xl p-8 w-72 shadow-2xl text-center" style="border:1px solid #2a2a2a;">
            <h3 class="text-xl font-bold mb-1 dark:text-gray-100">Cobrar</h3>
            <p id="charge-total" class="text-2xl font-bold text-green-600 mb-6"></p>

            <div id="charge-idle-state">
                <button onclick="startChargeCountdown()" class="w-full py-3 bg-green-600 text-white rounded-lg font-bold mb-2 hover:bg-green-700">Cobrar</button>
                <button onclick="closeModal()" class="w-full py-2 bg-gray-100 dark:bg-[#2a2a2a] text-gray-600 dark:text-gray-300 rounded-lg text-sm hover:bg-gray-200">Cancelar</button>
            </div>

            <div id="charge-counting-state" class="hidden">
                <div class="flex items-center justify-center mb-2">
                    <svg width="90" height="90" viewBox="0 0 90 90">
                        <circle cx="45" cy="45" r="38" fill="none" stroke="#2a2a2a" stroke-width="7"/>
                        <circle id="charge-circle" cx="45" cy="45" r="38" fill="none" stroke="#22c55e" stroke-width="7"
                            stroke-linecap="round"
                            stroke-dasharray="238.8"
                            stroke-dashoffset="0"
                            transform="rotate(-90 45 45)"
                            style="transition: stroke-dashoffset 1s linear;"/>
                        <text id="charge-countdown" x="45" y="53" text-anchor="middle" font-size="28" font-weight="bold" fill="#22c55e">3</text>
                    </svg>
                </div>
                <p class="text-sm text-gray-500 dark:text-gray-400">Procesando venta...</p>
            </div>
        </div>
    </div>

    <div id="drawer-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
    <div class="bg-white dark:bg-[#222] rounded-2xl p-8 w-80 shadow-2xl text-center" style="border:1px solid #2a2a2a;">
        <div style="font-size:48px;" class="mb-4">🪙</div>
        <h3 class="text-lg font-bold mb-2 dark:text-gray-100">Cajón abierto</h3>
        <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Cierra el cajón para terminar la venta</p>
        <div class="flex items-center justify-center">
            <svg width="80" height="80" viewBox="0 0 80 80">
                <circle cx="40" cy="40" r="34" fill="none" stroke="#2a2a2a" stroke-width="6"/>
                <circle id="drawer-circle" cx="40" cy="40" r="34" fill="none" stroke="#f97316" stroke-width="6"
                    stroke-linecap="round"
                    stroke-dasharray="213.6"
                    stroke-dashoffset="0"
                    transform="rotate(-90 40 40)"
                    style="transition: stroke-dashoffset 1s linear;"/>
                <text id="drawer-countdown" x="40" y="47" text-anchor="middle" font-size="24" font-weight="bold" fill="#f97316">5</text>
            </svg>
        </div>
    </div>
</div>

    <div id="new-student-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white dark:bg-[#222] rounded-2xl p-6 w-96 shadow-2xl" style="border:1px solid #2a2a2a;">
            <h3 class="text-lg font-bold mb-4 dark:text-gray-100">Agregar alumno</h3>
            <div class="flex flex-col gap-3">
                <input id="new-student-name" type="text" placeholder="Nombre completo"
                    class="border dark:border-[#333] dark:bg-[#2a2a2a] dark:text-gray-100 dark:placeholder-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <select id="new-student-level"
                    class="border dark:border-[#333] dark:bg-[#2a2a2a] dark:text-gray-100 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="kinder">Kinder</option>
                    <option value="primaria">Primaria</option>
                    <option value="secundaria">Secundaria</option>
                    <option value="preparatoria">Preparatoria</option>
                </select>
                <div class="flex gap-2 min-w-0">
                    <div class="flex items-center min-w-0 flex-1 border dark:border-[#333] rounded-lg overflow-hidden focus-within:ring-2 focus-within:ring-blue-500 dark:bg-[#2a2a2a]">
                        <input id="new-student-grade" type="number" min="1" max="12" placeholder="Grado"
                            class="min-w-0 flex-1 px-3 py-2 text-sm focus:outline-none dark:bg-[#2a2a2a] dark:text-gray-100 dark:placeholder-gray-600">
                        <span class="pr-3 text-gray-400 text-sm select-none">°</span>
                    </div>
                    <input id="new-student-group" type="text" placeholder="Grupo"
                        class="min-w-0 flex-1 border dark:border-[#333] dark:bg-[#2a2a2a] dark:text-gray-100 dark:placeholder-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                        oninput="this.value = this.value.toUpperCase()" maxlength="2">
                </div>
            </div>
            <div class="flex gap-2 mt-4">
                <button onclick="saveNewStudent()" class="flex-1 py-2 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700">Guardar</button>
                <button onclick="closeNewStudentModal()" class="flex-1 py-2 bg-gray-100 dark:bg-[#2a2a2a] text-gray-600 dark:text-gray-400 rounded-lg hover:bg-gray-200">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="sidebar"></div>

    <div class="flex flex-1 overflow-hidden ml-20">
        <div class="flex-1 flex flex-col p-4 overflow-hidden">
            <div class="flex justify-between items-center mb-3">
                <h1 class="text-xl font-bold dark:text-gray-100">Punto de Venta</h1>
                <div class="flex gap-2">

                    <div class="relative">
                        <button onclick="toggleDropdown('sort-dropdown')"
                            class="px-3 py-1.5 rounded-lg text-sm font-semibold bg-gray-200 dark:bg-[#2a2a2a] text-gray-700 dark:text-gray-300 flex items-center gap-1">
                            Ordenar: <span id="sort-label">Nombre</span> ▾
                        </button>
                        <div id="sort-dropdown" class="hidden absolute right-0 mt-1 bg-white dark:bg-[#2a2a2a] rounded-lg shadow-lg z-10 overflow-hidden" style="border:1px solid #333;min-width:150px;">
                            <div onclick="setSortAndClose('name', 'Nombre')" class="px-4 py-2 text-sm dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-[#333] cursor-pointer">Nombre A-Z</div>
                            <div onclick="setSortAndClose('name-desc', 'Nombre Z-A')" class="px-4 py-2 text-sm dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-[#333] cursor-pointer">Nombre Z-A</div>
                            <div onclick="setSortAndClose('price-asc', 'Precio ↑')" class="px-4 py-2 text-sm dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-[#333] cursor-pointer">Precio menor</div>
                            <div onclick="setSortAndClose('price-desc', 'Precio ↓')" class="px-4 py-2 text-sm dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-[#333] cursor-pointer">Precio mayor</div>
                            <div onclick="setSortAndClose('stock-asc', 'Stock ↑')" class="px-4 py-2 text-sm dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-[#333] cursor-pointer">Stock menor</div>
                            <div onclick="setSortAndClose('stock-desc', 'Stock ↓')" class="px-4 py-2 text-sm dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-[#333] cursor-pointer">Stock mayor</div>
                        </div>
                    </div>

                    <div class="relative">
                        <button onclick="toggleDropdown('view-dropdown')"
                            class="px-3 py-1.5 rounded-lg text-sm font-semibold bg-gray-200 dark:bg-[#2a2a2a] text-gray-700 dark:text-gray-300 flex items-center gap-1">
                            Vista: <span id="view-label">Lista</span> ▾
                        </button>
                        <div id="view-dropdown" class="hidden absolute right-0 mt-1 bg-white dark:bg-[#2a2a2a] rounded-lg shadow-lg z-10 overflow-hidden" style="border:1px solid #333;min-width:120px;">
                            <div onclick="setViewAndClose('list')" class="px-4 py-2 text-sm dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-[#333] cursor-pointer">☰ Lista</div>
                            <div onclick="setViewAndClose('grid')" class="px-4 py-2 text-sm dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-[#333] cursor-pointer">⊞ Grid</div>
                        </div>
                    </div>

                </div>
            </div>
            <input id="search-input" type="text" placeholder="Buscar producto o escanear código..."
                class="w-full border border-gray-300 dark:border-[#333] dark:bg-[#222] dark:text-gray-100 dark:placeholder-gray-600 rounded-lg px-4 py-2 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <div class="flex-1 overflow-y-auto" id="products-container"></div>
        </div>

        <div class="w-80 bg-white dark:bg-[#1e1e1e] flex flex-col shadow-lg" style="border-left:1px solid #2a2a2a;">
            <div class="p-4 border-b dark:border-[#2a2a2a]">
                <div class="flex gap-2 mb-3">
                    <button onclick="setPaymentMethod('CASH')" id="btn-cash" class="flex-1 py-2 rounded-lg bg-blue-600 text-white text-sm font-semibold">Efectivo</button>
                    <button onclick="setPaymentMethod('CARD')" id="btn-card" class="flex-1 py-2 rounded-lg bg-gray-200 dark:bg-[#2a2a2a] text-gray-700 dark:text-gray-400 text-sm font-semibold">Tarjeta</button>
                    <button onclick="setPaymentMethod('PREPAID_BALANCE')" id="btn-prepaid" class="flex-1 py-2 rounded-lg bg-gray-200 dark:bg-[#2a2a2a] text-gray-700 dark:text-gray-400 text-sm font-semibold">Saldo</button>
                    <button onclick="setPaymentMethod('FIADO')" id="btn-fiado" class="flex-1 py-2 rounded-lg bg-gray-200 dark:bg-[#2a2a2a] text-gray-700 dark:text-gray-400 text-sm font-semibold">Fiado</button>
                </div>
                <div id="cash-section">
                    <input id="cash-input" type="number" placeholder="Monto recibido"
                        class="w-full border dark:border-[#333] dark:bg-[#252525] dark:text-gray-100 dark:placeholder-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" oninput="calcChange()">
                </div>
                <div id="prepaid-section" class="hidden">
                    <input id="student-search" type="text" placeholder="Buscar alumno..."
                        class="w-full border dark:border-[#333] dark:bg-[#252525] dark:text-gray-100 dark:placeholder-gray-600 rounded-lg px-3 py-2 mb-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" oninput="searchStudent(this.value)">
                    <div id="student-list" class="border dark:border-[#333] rounded-lg max-h-32 overflow-y-auto text-sm dark:bg-[#252525]"></div>
                    <div id="recent-students" class="border dark:border-[#333] rounded-lg text-sm mt-2 dark:bg-[#252525]"></div>
                    <div id="balance-warning" class="hidden text-red-400 text-xs font-semibold mb-2 p-2 bg-red-50 dark:bg-red-900 rounded-lg mt-2"></div>
                    <div id="selected-student" class="hidden mt-2 p-2 bg-blue-50 dark:bg-blue-900 rounded-lg text-sm">
                        <span id="selected-student-name" class="font-semibold dark:text-blue-100"></span>
                        <span id="selected-student-balance" class="ml-2"></span>
                        <div id="student-remaining" class="text-xs mt-1"></div>
                    </div>
                </div>
                <div id="fiado-section" class="hidden">
                    <div class="flex gap-2 mb-2">
                        <input id="fiado-student-search" type="text" placeholder="Buscar alumno..."
                            class="flex-1 border dark:border-[#333] dark:bg-[#252525] dark:text-gray-100 dark:placeholder-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" oninput="searchStudentFiado(this.value)">
                        <button onclick="openNewStudentModal()" title="Agregar alumno nuevo"
                            class="w-9 h-9 flex-shrink-0 flex items-center justify-center bg-blue-600 text-white rounded-lg text-lg font-bold hover:bg-blue-700">+</button>
                    </div>
                    <div id="fiado-student-list" class="border dark:border-[#333] rounded-lg max-h-32 overflow-y-auto text-sm dark:bg-[#252525]"></div>
                    <div id="fiado-recent-students" class="border dark:border-[#333] rounded-lg text-sm mt-2 dark:bg-[#252525]"></div>
                    <div id="selected-student-fiado" class="hidden mt-2 p-2 bg-blue-50 dark:bg-blue-900 rounded-lg text-sm">
                        <span id="selected-student-fiado-name" class="font-semibold dark:text-blue-100"></span>
                        <span id="selected-student-fiado-balance" class="ml-2 text-xs text-gray-500 dark:text-gray-400"></span>
                    </div>
                </div>
            </div>
            <div class="p-4 border-b dark:border-[#2a2a2a]">
                <h2 class="font-bold text-lg dark:text-gray-100">Orden actual</h2>
            </div>
            <div id="order-items" class="flex-1 overflow-y-auto p-4">
                <p class="text-gray-400 text-sm">Sin productos</p>
            </div>
            <div class="p-4 border-t dark:border-[#2a2a2a]">
                <div class="flex justify-between font-bold text-lg mb-2 dark:text-gray-100">
                    <span>Total</span>
                    <span id="order-total">$0.00</span>
                </div>
                <div id="change-row" class="flex justify-between text-sm mb-4">
                    <span class="text-gray-500 dark:text-gray-500">Cambio</span>
                    <span id="change-display" class="font-semibold">$0.00</span>
                </div>
                <button onclick="openModal()" class="w-full py-4 bg-green-600 text-white rounded-xl font-bold text-lg hover:bg-green-700">Cobrar</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
